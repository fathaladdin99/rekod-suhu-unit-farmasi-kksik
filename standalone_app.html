<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rekod Suhu Master — Unit Farmasi KK Sik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.4;
      padding-bottom: 30px;
      touch-action: manipulation;
    }

    .app-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 12px 14px;
    }
    .header-container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-badge {
      font-size: 0.65rem;
      font-weight: 800;
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 12px;
    }
    .brand-title { font-size: 1.15rem; font-weight: 800; }

    .main-wrapper { max-width: 600px; margin: 0 auto; padding: 10px; }

    .location-segmented-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: white;
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      gap: 4px;
      margin-bottom: 10px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 10px 4px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .card {
      background: white;
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .form-row-compact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    label { display: block; font-weight: 700; font-size: 0.78rem; margin-bottom: 3px; }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      min-height: 44px;
    }

    .slot-pill-group {
      display: flex; gap: 4px; background: var(--bg-subtle); padding: 3px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-color); min-height: 44px; align-items: center;
    }
    .slot-pill { flex: 1; }
    .slot-pill input { display: none; }
    .slot-label {
      display: flex; justify-content: center; align-items: center; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 0.8rem; color: var(--text-muted); height: 36px;
    }
    .slot-pill input:checked + .slot-label { background: var(--primary); color: white; }

    .temp-grid-mobile { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .temp-box { background: var(--bg-subtle); border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); padding: 8px 6px; text-align: center; }
    .temp-box label { font-size: 0.72rem; font-weight: 800; color: var(--primary-dark); }
    .temp-box input { text-align: center; font-weight: 800; font-size: 1.15rem; height: 44px; }

    .btn-group-mobile { display: flex; gap: 8px; margin-top: 10px; }
    .btn { padding: 12px 16px; border-radius: var(--radius-sm); font-weight: 800; font-size: 0.92rem; cursor: pointer; border: none; min-height: 48px; flex: 1; }
    .btn-primary { background: var(--primary); color: white; flex: 2; }
    .btn-secondary { background: var(--bg-subtle); color: var(--text-main); border: 1.5px solid var(--border-color); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-container">
      <div>
        <span class="brand-badge">KK Sik • Unit Farmasi</span>
        <h1 class="brand-title">❄️ Rekod Suhu Master</h1>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <nav class="location-segmented-bar">
      <button class="tab-btn active" onclick="switchLokasi('PETI_SEJUK')">🧊 Peti Sejuk</button>
      <button class="tab-btn" onclick="switchLokasi('BILIK')">🏢 Bilik</button>
      <button class="tab-btn" onclick="switchLokasi('SUBSTOR')">📦 Substor</button>
    </nav>

    <div class="card">
      <form id="tempForm">
        <div class="form-row-compact">
          <div>
            <label for="dateInput">📅 Tarikh Log</label>
            <input type="date" id="dateInput" name="date" required />
          </div>
          <div>
            <label>⏰ Sesi Log</label>
            <div class="slot-pill-group">
              <div class="slot-pill">
                <input type="radio" id="slotAM" name="slot" value="AM" checked />
                <label for="slotAM" class="slot-label">AM</label>
              </div>
              <div class="slot-pill">
                <input type="radio" id="slotPM" name="slot" value="PM" />
                <label for="slotPM" class="slot-label">PM</label>
              </div>
            </div>
          </div>
        </div>

        <div class="temp-grid-mobile">
          <div class="temp-box">
            <label for="min">MIN (°C)</label>
            <input type="number" step="0.1" id="min" name="min" placeholder="4.0" inputmode="decimal" required />
          </div>
          <div class="temp-box" style="border-color:var(--primary);">
            <label for="semasa">SEMASA (°C)</label>
            <input type="number" step="0.1" id="semasa" name="semasa" placeholder="4.5" inputmode="decimal" required />
          </div>
          <div class="temp-box">
            <label for="max">MAX (°C)</label>
            <input type="number" step="0.1" id="max" name="max" placeholder="5.2" inputmode="decimal" required />
          </div>
        </div>

        <div style="margin-bottom:10px;">
          <label for="namaInput">👤 Nama Pegawai / Pencatat</label>
          <input type="text" id="namaInput" name="nama" placeholder="Nama Pencatat" required autocomplete="name" />
        </div>

        <div class="btn-group-mobile">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('tempForm').reset()">Semula</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">🚀 Hantar Rekod Suhu</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    let currentLokasi = 'PETI_SEJUK';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx84PC4_XAKuYaT9NGZgq4-wZbafTlal7h4YmURvX0rZ5-6zQrRpM_FcxAbt-HMo28/exec';

    document.addEventListener('DOMContentLoaded', () => {
      const d = new Date();
      const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      document.getElementById('dateInput').value = iso;
      if (d.getHours() >= 14) document.getElementById('slotPM').checked = true;

      const savedName = localStorage.getItem('kk_sik_staff_name');
      if (savedName) document.getElementById('namaInput').value = savedName;
    });

    function switchLokasi(loc) {
      currentLokasi = loc;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(loc.replace('_',' ')));
      });
    }

    document.getElementById('tempForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Menghantar...';

      const payload = {
        lokasi: currentLokasi,
        date: fd.get('date'),
        slot: fd.get('slot'),
        min: fd.get('min'),
        semasa: fd.get('semasa'),
        max: fd.get('max'),
        nama: fd.get('nama')
      };

      if (payload.nama) localStorage.setItem('kk_sik_staff_name', payload.nama);

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        alert('✅ Berjaya Dihantar!');
      } catch (err) {
        alert('⚠️ Simpan Offline!');
      }

      btn.disabled = false;
      btn.textContent = '🚀 Hantar Rekod Suhu';
    });
  </script>
</body>
</html>
